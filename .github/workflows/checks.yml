name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Lint (rules in pyproject.toml)
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant and the test tools
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Install what the conversation component needs
        run: python -m pip install --disable-pip-version-check $(python scripts/ha_requirements.py conversation)
      - name: Run tests
        run: python -m pytest -q
